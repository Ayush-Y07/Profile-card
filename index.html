<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Cards</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="profile-section">

        <h1>Team Crango</h1>
        <p class="subtitle">Meet our talented developers</p>

        <div class="profile-container">

            <!-- Ayush -->
            <div class="profile-card">

                <div class="profile-picture avatar-ayush" role="img" aria-label="Ayush profile avatar">A</div>

                <h2 id="ayush">Ayush</h2>

                <h3 class="role">Frontend Designer</h3>

                <p class="bio">
                    Creates beautiful and responsive user interfaces.
                </p>

            </div>


            <!-- Aniket -->
            <div class="profile-card">

                <div class="profile-picture avatar-aniket" role="img" aria-label="Aniket profile avatar">A</div>

                <h2 id="aniket">Aniket</h2>

                <h3 class="role">Backend Developer</h3>

                <p class="bio">
                    Builds powerful and reliable server-side applications.
                </p>

            </div>


            <!-- Mani -->
            <div class="profile-card">

                <div class="profile-picture avatar-mani" role="img" aria-label="Mani profile avatar">M</div>

                <h2 id="mani">Mani</h2>

                <h3 class="role">Database Developer</h3>

                <p class="bio">
                    Manages data and designs efficient database systems.
                </p>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
